name: Firestore Emulator Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install application dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.16.0

      - name: Run Auth and Firestore emulator integration tests
        run: >-
          firebase emulators:exec
          --project demo-starry-love-diary
          --only auth,firestore
          "npx vitest run --config vitest.firebase.config.ts"
